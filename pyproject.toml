[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quant-dynamics"
version = "0.1.0"
description = "Systematic Machine Learning, Market Regime Detection & Time-Series Backtesting Framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "torch>=2.1.0",
    "ccxt>=4.0.0",
    "plotly>=5.18.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "tables>=3.9.0",
    "schedule>=1.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "requests>=2.31.0",
    "optuna>=3.5.0",
    "joblib>=1.3.0",
    "pyarrow>=15.0.0",
    "yfinance>=0.2.30",
    "arch>=5.3.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
quant-dynamics = "main:main"
qd = "main:main"

[tool.setuptools]
packages = ["config", "data", "models", "streaming", "backtest", "utils"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top
    "F401",  # unused imports
    "F841",  # unused variables
    "I001",  # unsorted imports
    "W291",  # trailing whitespace
    "W293",  # blank lines with whitespace
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
